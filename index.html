<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily spending tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f1a;
    --card: rgba(255,255,255,.06);
    --card-border: rgba(255,255,255,.12);
    --field: rgba(255,255,255,.05);
    --field-border: rgba(255,255,255,.14);
    --text: #f2f4f8;
    --muted: #97a1b6;
    --mint: #3ee6b0;
    --coral: #ff6a55;
    --violet: #7b6bff;
    --err: #ff8a7a;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef1f8;
      --card: rgba(255,255,255,.75);
      --card-border: rgba(20,30,60,.1);
      --field: rgba(255,255,255,.9);
      --field-border: rgba(20,30,60,.14);
      --text: #141a2b;
      --muted: #5f6a82;
      --mint: #0aa57a;
      --err: #c4392a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    display: grid;
    place-items: center;
    padding: 28px 16px;
    overflow-x: hidden;
  }

  /* Animated background */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55; animation: drift 18s ease-in-out infinite alternate; }
  .b1 { width: 46vmax; height: 46vmax; background: var(--violet); top: -18vmax; left: -12vmax; }
  .b2 { width: 40vmax; height: 40vmax; background: var(--coral); bottom: -16vmax; right: -10vmax; animation-duration: 22s; }
  .b3 { width: 28vmax; height: 28vmax; background: var(--mint); top: 40%; left: 55%; opacity: .3; animation-duration: 26s; }
  @keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.15); } }
  .grain { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px); background-size: 22px 22px; mask-image: radial-gradient(circle at 50% 40%, #000, transparent 75%); }

  /* Card */
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 460px;
    padding: 34px 28px 28px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 26px;
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.6);
    overflow: hidden;
    animation: rise .8s cubic-bezier(.2,.8,.2,1) both;
  }
  .card::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,.14), transparent 60%);
    opacity: 0; transition: opacity .3s;
  }
  .card:hover::before { opacity: 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); } }

  header { margin-bottom: 26px; }
  .tag { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 0 var(--mint); animation: ping 2s infinite; }
  @keyframes ping { 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  h1 {
    font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.05;
    letter-spacing: -.02em; margin: 10px 0 0;
    background: linear-gradient(120deg, var(--text) 30%, var(--mint) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* Fields */
  .field { margin-bottom: 18px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  label { font-size: 14px; font-weight: 600; }
  .req { color: var(--coral); margin-left: 2px; }
  .chips { display: flex; gap: 6px; }
  .chip {
    font: inherit; font-size: 12px; font-weight: 500; color: var(--muted);
    background: transparent; border: 1px solid var(--field-border); border-radius: 99px;
    padding: 3px 10px; cursor: pointer; transition: all .15s;
  }
  .chip:hover { color: var(--text); border-color: var(--mint); transform: translateY(-1px); }
  .chip:active { transform: scale(.94); }
  .input-wrap { position: relative; }
  .prefix {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-family: var(--display); font-size: 18px; font-weight: 600; color: var(--muted);
    transition: color .2s; pointer-events: none;
  }
  input {
    width: 100%; height: 54px; padding: 0 16px;
    font: inherit; font-size: 16px; color: var(--text);
    background: var(--field); border: 1px solid var(--field-border); border-radius: 14px;
    transition: border-color .2s, box-shadow .2s, background .2s;
    color-scheme: dark light;
  }
  input.money { padding-left: 38px; font-family: var(--display); font-size: 20px; font-weight: 600; }
  input::placeholder { color: var(--muted); font-family: var(--body); font-size: 14px; font-weight: 400; }
  input:focus { outline: none; border-color: var(--mint); box-shadow: 0 0 0 4px rgba(62,230,176,.16); }
  .input-wrap:focus-within .prefix { color: var(--mint); }
  input[type=number] { appearance: textfield; -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input.invalid { border-color: var(--err); animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  /* Custom calendar */
  :root { --pop: rgba(22,27,46,.97); }
  @media (prefers-color-scheme: light) { :root { --pop: rgba(255,255,255,.98); } }
  .datepick { position: relative; }
  .datebtn {
    width: 100%; height: 54px; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-align: left;
    font: inherit; font-size: 16px; font-weight: 500; color: var(--text); cursor: pointer;
    background: var(--field); border: 1px solid var(--field-border); border-radius: 14px;
    transition: border-color .2s, box-shadow .2s, transform .15s;
  }
  .datebtn:hover { border-color: var(--mint); }
  .datebtn:active { transform: scale(.99); }
  .datebtn:focus-visible, .datebtn[aria-expanded="true"] { outline: none; border-color: var(--mint); box-shadow: 0 0 0 4px rgba(62,230,176,.16); }
  .datebtn .ico { font-size: 20px; line-height: 1; }
  .datebtn #dateText { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .datebtn svg { flex: none; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s; }
  .datebtn[aria-expanded="true"] svg { transform: rotate(180deg); stroke: var(--mint); }
  .datebtn.invalid { border-color: var(--err); animation: shake .35s; }
  .cal {
    position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 10px);
    padding: 16px; border-radius: 20px; background: var(--pop);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.65);
    transform-origin: top center; animation: calIn .22s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .cal[hidden] { display: none; }
  @keyframes calIn { from { opacity: 0; transform: translateY(-8px) scale(.96); } }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-title { font-family: var(--display); font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
  .cal-title small { font-weight: 500; color: var(--muted); font-size: 15px; margin-left: 4px; }
  .nav { width: 36px; height: 36px; display: grid; place-items: center; font: inherit; font-size: 20px; color: var(--text); cursor: pointer; background: var(--field); border: 1px solid var(--field-border); border-radius: 50%; transition: all .15s; }
  .nav:hover { border-color: var(--mint); color: var(--mint); transform: scale(1.08); }
  .nav:active { transform: scale(.92); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .wd { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 0 8px; }
  .day {
    aspect-ratio: 1; display: grid; place-items: center; font: inherit; font-size: 14px; font-weight: 500;
    color: var(--text); cursor: pointer; background: transparent; border: 1px solid transparent; border-radius: 50%;
    font-variant-numeric: tabular-nums; transition: background .15s, transform .15s, border-color .15s;
  }
  .day.out { color: var(--muted); opacity: .4; }
  .day:hover { background: var(--field); border-color: var(--field-border); transform: scale(1.1); }
  .day.today { border-color: var(--mint); color: var(--mint); font-weight: 700; }
  .day.sel, .day.sel:hover { color: #fff; font-weight: 700; border-color: transparent; background: linear-gradient(135deg, var(--coral), #ff8a4c); box-shadow: 0 8px 18px -6px var(--coral); transform: scale(1.05); }
  .day:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
  .cal-foot { display: flex; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--card-border); }
  .cal-foot .chip { flex: 1; padding: 8px 10px; font-size: 13px; }

  /* Total */
  .total {
    display: flex; justify-content: space-between; align-items: center;
    margin: 6px 0 20px; padding: 14px 16px; border-radius: 14px;
    background: linear-gradient(120deg, rgba(62,230,176,.14), rgba(123,107,255,.14));
    border: 1px solid var(--card-border);
  }
  .total span { font-size: 14px; color: var(--muted); }
  .total strong { font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .total.bump strong { animation: bump .3s; }
  @keyframes bump { 40% { transform: scale(1.08); color: var(--mint); } }

  /* Button */
  .btn {
    position: relative; width: 100%; height: 56px; border: 0; border-radius: 16px; cursor: pointer; overflow: hidden;
    font-family: var(--display); font-size: 17px; font-weight: 600; color: #fff;
    background: linear-gradient(120deg, var(--coral), #ff8a4c);
    box-shadow: 0 14px 30px -12px var(--coral);
    transition: transform .15s, box-shadow .2s, filter .2s;
  }
  .btn::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-120%);
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.4), transparent 70%);
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 20px 36px -12px var(--coral); }
  .btn:hover:not(:disabled)::after { transform: translateX(120%); transition: transform .7s; }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn:focus-visible, .chip:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
  .btn:disabled { cursor: wait; filter: saturate(.7); }
  .spin { display: none; width: 20px; height: 20px; margin: auto; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: rot .7s linear infinite; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .btn.loading .spin { display: block; margin: 0; }
  .spin { flex: none; }
  form.busy .field, form.busy .total { opacity: .55; pointer-events: none; transition: opacity .2s; }
  @keyframes rot { to { transform: rotate(360deg); } }

  .error {
    display: none; margin-top: 16px; padding: 14px; border-radius: 14px; font-size: 14px;
    color: var(--err); background: rgba(255,106,85,.1); border: 1px solid rgba(255,106,85,.35);
  }
  .error.show { display: block; animation: rise .4s both; }
  .error b { display: block; margin-bottom: 3px; }

  /* Success view */
  .success { display: none; text-align: center; }
  .card.done form, .card.done header { display: none; }
  .card.done .success { display: block; animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
  .emoji { font-size: 78px; line-height: 1; margin: 4px 0 14px; display: inline-block; animation: pop .9s cubic-bezier(.2,1.6,.4,1) both, wiggle 2.6s 1.1s ease-in-out infinite; }
  @keyframes pop { from { transform: scale(0) rotate(-35deg); opacity: 0; } }
  @keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-8deg) scale(1.06); } 86% { transform: rotate(8deg) scale(1.06); } 94% { transform: rotate(-4deg); } }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .stat { padding: 12px 10px; border-radius: 14px; background: var(--field); border: 1px solid var(--card-border); animation: rise .6s both; }
  .stat:nth-child(2) { animation-delay: .1s; }
  .stat:nth-child(3) { grid-column: 1 / -1; animation-delay: .2s; background: linear-gradient(120deg, rgba(62,230,176,.16), rgba(123,107,255,.16)); }
  .stat span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .stat b { font-family: var(--display); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat:nth-child(3) b { font-size: 30px; }
  .success h2 { font-family: var(--display); font-size: 28px; font-weight: 800; margin: 0 0 6px; letter-spacing: -.02em; }
  .success p { margin: 0; color: var(--muted); font-size: 15px; }
  .success p b { color: var(--text); }
  .resp { margin-top: 20px; text-align: left; }
  .resp .cap { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  pre {
    margin: 0; padding: 14px; max-height: 190px; overflow: auto;
    font: 12.5px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--mint);
    white-space: pre-wrap; word-break: break-word;
    background: rgba(0,0,0,.28); border: 1px solid var(--card-border); border-radius: 12px;
  }
  @media (prefers-color-scheme: light) { pre { background: rgba(20,30,60,.06); } }
  .again {
    margin-top: 20px; width: 100%; height: 50px; cursor: pointer; font: inherit; font-weight: 600; color: var(--text);
    background: transparent; border: 1px solid var(--field-border); border-radius: 14px; transition: all .2s;
  }
  .again:hover { border-color: var(--mint); color: var(--mint); }

  /* Confetti */
  .confetti { position: absolute; left: 50%; top: 110px; font-size: 24px; line-height: 1; font-style: normal; pointer-events: none; animation: burst 1.1s cubic-bezier(.1,.8,.3,1) forwards; }
  @keyframes burst { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }

  @media (max-width: 420px) { .card { padding: 28px 20px 22px; border-radius: 22px; } h1 { font-size: 29px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grain"></div></div>

  <main class="card" id="card">
    <header>
      <div class="tag"><span class="pulse"></span>Auto daily spending tracking</div>
      <h1>What did you spend today?</h1>
    </header>

    <form id="form" novalidate>
      <div class="field">
        <div class="row"><label for="dateBtn">Date<span class="req">*</span></label></div>
        <div class="datepick" id="datepick">
          <input type="hidden" id="date" name="date" required>
          <button type="button" class="datebtn" id="dateBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="cal">
            <span class="ico">📅</span><span id="dateText">Pick a date</span>
            <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="cal" id="cal" role="dialog" aria-label="Choose a date" hidden></div>
        </div>
      </div>

      <div class="field">
        <div class="row">
          <label for="upi">Through UPI / Credit card</label>
          <div class="chips" data-for="upi">
            <button type="button" class="chip" data-add="20">+20</button>
          </div>
        </div>
        <div class="input-wrap"><span class="prefix">₹</span>
          <input class="money" type="number" id="upi" name="upi" inputmode="decimal" min="0" step="0.01" placeholder="Enter spending through UPI">
        </div>
      </div>

      <div class="field">
        <div class="row">
          <label for="cash">Through Cash</label>
          <div class="chips" data-for="cash">
            <button type="button" class="chip" data-add="20">+20</button>
          </div>
        </div>
        <div class="input-wrap"><span class="prefix">₹</span>
          <input class="money" type="number" id="cash" name="cash" inputmode="decimal" min="0" step="0.01" placeholder="Enter spending through Cash">
        </div>
      </div>

      <div class="total" id="totalBox"><span>Total for the day</span><strong id="total">₹0.00</strong></div>

      <button type="submit" class="btn" id="submit"><span class="label">Submit</span><span class="spin"></span></button>
      <div class="error" id="error" role="alert"></div>
    </form>

    <section class="success" id="success" aria-live="polite">
      <div class="emoji" id="emoji">🎉</div>
      <h2 id="successTitle">Spending saved!</h2>
      <p id="successText"></p>
      <div class="stats">
        <div class="stat"><span>💳 UPI / Card</span><b id="sUpi"></b></div>
        <div class="stat"><span>💵 Cash</span><b id="sCash"></b></div>
        <div class="stat"><span>💰 Total spent today</span><b id="sTotal"></b></div>
      </div>
      <div class="resp"><div class="cap">📩 Webhook response</div><pre id="resp"></pre></div>
      <button type="button" class="again" id="again">Add another entry</button>
    </section>
  </main>

<script>
  // ====== CONFIG: paste your webhook URL here ======
  const WEBHOOK_URL = "https://sateeshreddymaddi-n8n.duckdns.org/webhook/cbf7ee3f-bd22-4a3e-8e9c-43ea8417c776";
  // =================================================

  const $ = id => document.getElementById(id);
  const card = $("card"), form = $("form"), btn = $("submit"), errBox = $("error");

  // Default date = today (local time)
  const t = new Date();
  $("date").value = new Date(t.getTime() - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

  // ===== Custom calendar =====
  (() => {
    const btn = $("dateBtn"), pop = $("cal"), hid = $("date"), txt = $("dateText"), wrap = $("datepick");
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const pad = n => String(n).padStart(2, "0");
    const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const parse = v => { const [y, m, d] = v.split("-").map(Number); return new Date(y, m - 1, d); };
    let sel = hid.value ? parse(hid.value) : new Date();
    let view = new Date(sel.getFullYear(), sel.getMonth(), 1);

    function setDate(d) {
      sel = d; hid.value = iso(d);
      txt.textContent = d.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    }
    function render() {
      const y = view.getFullYear(), m = view.getMonth();
      const start = new Date(y, m, 1 - view.getDay());
      const today = iso(new Date()), selIso = iso(sel);
      let h = `<div class="cal-head">
        <button type="button" class="nav" data-nav="-1" aria-label="Previous month">‹</button>
        <div class="cal-title">${MONTHS[m]}<small>${y}</small></div>
        <button type="button" class="nav" data-nav="1" aria-label="Next month">›</button></div>
        <div class="cal-grid">${WD.map(w => `<div class="wd">${w}</div>`).join("")}`;
      for (let i = 0; i < 42; i++) {
        const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), k = iso(d);
        const cls = ["day", d.getMonth() !== m && "out", k === today && "today", k === selIso && "sel"].filter(Boolean).join(" ");
        h += `<button type="button" class="${cls}" data-d="${k}" aria-label="${d.toDateString()}"${k === selIso ? ' aria-current="date"' : ""}>${d.getDate()}</button>`;
      }
      h += `</div><div class="cal-foot">
        <button type="button" class="chip" data-quick="-1">Yesterday</button>
        <button type="button" class="chip" data-quick="0">Today</button></div>`;
      pop.innerHTML = h;
    }
    function open() { view = new Date(sel.getFullYear(), sel.getMonth(), 1); render(); pop.hidden = false; btn.setAttribute("aria-expanded", "true"); }
    function close() { pop.hidden = true; btn.setAttribute("aria-expanded", "false"); }

    btn.addEventListener("click", () => pop.hidden ? open() : close());
    pop.addEventListener("click", e => {
      const nav = e.target.closest("[data-nav]"), day = e.target.closest("[data-d]"), q = e.target.closest("[data-quick]");
      if (nav) { view = new Date(view.getFullYear(), view.getMonth() + +nav.dataset.nav, 1); render(); }
      else if (day) { setDate(parse(day.dataset.d)); close(); btn.focus(); }
      else if (q) { const n = new Date(); n.setDate(n.getDate() + +q.dataset.quick); setDate(n); close(); btn.focus(); }
    });
    document.addEventListener("pointerdown", e => { if (!pop.hidden && !wrap.contains(e.target)) close(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !pop.hidden) { close(); btn.focus(); } });
    setDate(sel);
  })();

  const num = v => (v === "" || isNaN(parseFloat(v))) ? 0 : parseFloat(v);
  const fmt = n => "₹" + n.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // Animated total
  let shown = 0, raf;
  function updateTotal() {
    const target = num($("upi").value) + num($("cash").value);
    const from = shown, start = performance.now();
    cancelAnimationFrame(raf);
    const step = now => {
      const p = Math.min((now - start) / 350, 1), e = 1 - Math.pow(1 - p, 3);
      shown = from + (target - from) * e;
      $("total").textContent = fmt(shown);
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    $("totalBox").classList.remove("bump"); void $("totalBox").offsetWidth; $("totalBox").classList.add("bump");
  }
  $("upi").addEventListener("input", updateTotal);
  $("cash").addEventListener("input", updateTotal);

  // Quick-add chips
  document.querySelectorAll(".chips").forEach(group => {
    group.addEventListener("click", e => {
      const c = e.target.closest(".chip"); if (!c) return;
      const input = $(group.dataset.for);
      input.value = +(num(input.value) + +c.dataset.add).toFixed(2);
      updateTotal();
    });
  });

  // Pointer glow on card
  card.addEventListener("pointermove", e => {
    const r = card.getBoundingClientRect();
    card.style.setProperty("--mx", (e.clientX - r.left) + "px");
    card.style.setProperty("--my", (e.clientY - r.top) + "px");
  });

  function showError(title, body) {
    errBox.innerHTML = "";
    const b = document.createElement("b"); b.textContent = title;
    const d = document.createElement("div"); d.textContent = body;
    errBox.append(b, d);
    errBox.classList.remove("show"); void errBox.offsetWidth; errBox.classList.add("show");
  }

  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const bits = ["🎉", "✨", "💸", "🪙", "🎊", "💰"];
    for (let i = 0; i < 26; i++) {
      const s = document.createElement("i");
      s.className = "confetti";
      s.textContent = bits[i % bits.length];
      const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 150;
      s.style.cssText = `--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d - 40}px;--r:${Math.random() * 720 - 360}deg;`;
      card.appendChild(s);
      setTimeout(() => s.remove(), 1200);
    }
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    errBox.classList.remove("show");

    if (!$("date").value) {
      $("dateBtn").classList.add("invalid"); setTimeout(() => $("dateBtn").classList.remove("invalid"), 400);
      showError("Date is required", "Pick a date and submit again."); return;
    }
    if (!WEBHOOK_URL || WEBHOOK_URL.startsWith("PASTE_")) {
      showError("Webhook URL is missing", "Set WEBHOOK_URL at the top of the script."); return;
    }

    const upi = num($("upi").value), cash = num($("cash").value);
    const payload = {
      date: $("date").value,            // YYYY-MM-DD
      upi_credit_card: upi,
      cash: cash,
      total: upi + cash,
      submitted_at: new Date().toISOString()
    };

    // Lock the form and wait until the webhook sends its reply
    btn.disabled = true; btn.classList.add("loading"); form.classList.add("busy");
    form.querySelectorAll("input").forEach(i => i.readOnly = true);
    btn.querySelector(".label").textContent = "Saving to sheet…";
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 60000);   // wait up to 60 seconds
    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        signal: ctrl.signal
      });
      const raw = await res.text();   // resolves only after the webhook has responded
      let pretty = raw, data = null;
      try { data = JSON.parse(raw); pretty = JSON.stringify(data, null, 2); } catch (_) {}

      if (!res.ok) throw Object.assign(new Error("Webhook returned " + res.status + " " + res.statusText), { details: pretty });

      // Use amounts from the webhook response when it sends them, otherwise what we submitted
      const pick = (keys, fallback) => {
        if (data && typeof data === "object") for (const k of keys) {
          const v = parseFloat(String(data[k]).replace(/[^\d.\-]/g, ""));
          if (data[k] != null && !isNaN(v)) return v;
        }
        return fallback;
      };
      const rUpi = pick(["upi_credit_card", "upi", "Through UPI"], payload.upi_credit_card);
      const rCash = pick(["cash", "Through Cash"], payload.cash);
      const rTotal = pick(["total", "Total Spending for Today"], payload.total);
      $("sUpi").textContent = fmt(rUpi);
      $("sCash").textContent = fmt(rCash);
      $("sTotal").textContent = fmt(rTotal);

      // Mood emoji based on the day's total
      const mood = rTotal === 0 ? ["🧘", "No-spend day!"]
                 : rTotal < 500 ? ["😎", "Light spending day!"]
                 : rTotal < 2000 ? ["💸", "Spending saved!"]
                 : ["😮", "Big spending day!"];
      $("emoji").textContent = mood[0];
      $("successTitle").textContent = mood[1];
      $("successText").textContent = "✅ Logged for " + payload.date;
      $("resp").textContent = pretty || "(empty response)";
      card.classList.add("done");
      confetti();
    } catch (err) {
      showError("Couldn't send your spending",
        err.name === "AbortError" ? "The webhook took longer than 60 seconds to respond. Check your sheet before submitting again, so you don't add a duplicate."
        : err.details ? err.message + "\n" + err.details
        : "Check the webhook URL and your connection. If it keeps failing, the webhook may need to allow requests from this page (CORS).");
    } finally {
      clearTimeout(timer);
      btn.disabled = false; btn.classList.remove("loading"); form.classList.remove("busy");
      form.querySelectorAll("input").forEach(i => i.readOnly = false);
      btn.querySelector(".label").textContent = "Submit";
    }
  });

  $("again").addEventListener("click", () => {
    $("upi").value = ""; $("cash").value = ""; updateTotal();
    card.classList.remove("done");
  });
</script>
</body>
</html>
